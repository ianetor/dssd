spring.application.name=backend
server.port=8080

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Las cantidades de recursos deben ser enteras, sin truncar decimales recibidos.
spring.jackson.deserialization.accept-float-as-int=false

# Cliente HTTP hacia el Sistema Nacional. La lectura es larga porque el cloud gratuito
# tarda cerca de un minuto en despertar tras un período sin uso.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=75s
