spring.application.name=backend
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://db:5432/distribuidosBD
spring.datasource.username=postgres
spring.datasource.password=1212
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Bonita Runtime
bonita.url=${BONITA_URL:http://host.docker.internal:8081/bonita}
bonita.username=${BONITA_USERNAME:}
bonita.password=${BONITA_PASSWORD:}
